# config.yaml
model:
  total_input_dim: 206
  high_freq_dim: 175
  mid_freq_dim: 17
  low_freq_dim: 14
  seq_len: 600

  router_hidden: 256
  router_output_dim: 8
  router_layers: 1
  router_parallelism: 1

  num_experts: 3
  expert_hidden: 128
  expert_layers: 4
  expert_parallelism: 1
  expert_dropout: 0.2

  fusion_hidden: 64
  fusion_layers: 8
  fusion_parallelism: 1

  head_hidden: 128

  val_ratio: 0.04
  test_ratio: 0.03

class_config:
  ls_choice:
    1m: 2
    3m: 2
    5m: 2
    15m: 2
    30m: 2
  volat:
    1m: 2
    3m: 2
    5m: 2
    15m: 2
    30m: 2

training:
  seed: 1111                   # 随机种子，保证可复现性
  batch_size: 16                # M 系列芯片显存有限，建议 16 或 32
  num_epochs: 50
  grad_clip: 1.0                # 梯度裁剪阈值
  device: "auto"                # 自动选择：mps / cuda / cpu
  interval: 300
  low_freq_type: factor_k1h
  mid_freq_type: factor_k5m
  prefetch_factor: 1
  # 学习率调度
  lr: 0.002
  weight_decay: 0.001
  label_start: 7
  label_end: 8
  label_type: ls0_labels
  alphas:
    - 0.9
# ==========================================
# 回调与保存
# ==========================================
callbacks:
  save_dir: "checkpoints/exp_m4_big"  # 所有输出（模型、日志、CSV、test结果）保存目录
  patience: 3                    # 早停耐心值：验证 loss 连续 5 轮不下降则停止