# config_default.yaml
model:
  name: "MultiFreqMultiLabelClassifier"
  device: "auto"
  init_seed: 42

  low_freq:
    input_dim: 10
    seq_len: 100
    feature_dim: 64

    dnn1:
      hidden_dims_list: [[32, 64]]
      activations: "relu"
      dropouts: 0.1
      use_layer_norms: true
      aggregation_method: "concat"

    cnn:
      hidden_dims_list: [[128, 256]]
      kernel_sizes_list: [[3, 5]]
      dilations_list: null
      strides_list: null
      use_skip_connections_list: true
      aggregation_method: "concat"

    rnn:
      types: "gru"
      hidden_dims: 128
      num_layers_list: 2
      dropout_list: 0.2
      aggregation_method: "concat"
      use_attention_aggregation: false

    use_residual_connections: false
    residual_strength: 0.1

  mid_freq:
    input_dim: 20
    seq_len: 200
    feature_dim: 128

    dnn1:
      hidden_dims_list: [[64, 128]]
      activations: "relu"
      dropouts: 0.1
      use_layer_norms: true
      aggregation_method: "concat"

    cnn:
      hidden_dims_list: [[256, 512]]
      kernel_sizes_list: [[5, 7]]
      dilations_list: null
      strides_list: null
      use_skip_connections_list: true
      aggregation_method: "concat"

    rnn:
      types: "lstm"
      hidden_dims: 256
      num_layers_list: 2
      dropout_list: 0.3
      aggregation_method: "concat"
      use_attention_aggregation: false

    use_residual_connections: true
    residual_strength: 0.1
    use_film: true

  feature_fusion:
    shared_hidden_dims: [512, 256]
    dropout: 0.3
    use_batch_norm: true
    activation: "relu"

  classification:
    num_labels: 5
    per_label_hidden_dims: [128, 64]
    label_dropout: 0.2
    use_batch_norm: true
    threshold: 0.5

  training:
    batch_size: 32
    learning_rate: 0.001
    weight_decay: 0.0001
    num_epochs: 100
    early_stopping_patience: 10
    lr_scheduler:
      enabled: true
      factor: 0.5
      patience: 5
      min_lr: 1.0e-06

  evaluation:
    metrics: ["accuracy", "f1_micro", "f1_macro", "precision", "recall"]
    threshold: 0.5
    average_methods: ["micro", "macro", "weighted"]