# 时间序列预测模型配置示例
# 每个配置项都有详细说明

# 模型名称，用于标识
model_name: ExampleTimeSeriesModel
# 模型描述，说明模型用途和特点
description: 时间序列预测示例配置 - 包含所有配置项和详细说明
# 配置版本
version: '1.0.0'

# 输入特征维度，每个时间步的特征数量
input_dim: 30
# 输入序列长度，时间步数量
input_seq_len: 500

# 第一个DNN模块配置（特征提取）
dnn1:
  # 每个DNN路径的隐藏层维度列表，例如[[32,64,128],[64,128,256]]表示两个路径
  hidden_dims_list:
    - - 32
      - 64
      - 128
    - - 64
      - 128
      - 256
  # 激活函数，可以是单个字符串或列表
  activations: relu
  # dropout率，防止过拟合
  dropouts:
    - 0.1
    - 0.15
  # 是否使用LayerNorm
  use_layer_norms:
    - true
    - true
  # 多路径聚合方法：concat(拼接), sum(求和), mean(平均), max(最大值)
  aggregation_method: concat

# CNN模块配置（时序特征提取）
cnn:
  # 每个CNN路径的隐藏层维度
  hidden_dims_list:
    - - 128
      - 256
      - 512
    - - 256
      - 512
      - 1024
  # 每个CNN路径的卷积核大小
  kernel_sizes_list:
    - - 3
      - 5
      - 7
    - - 5
      - 7
      - 9
  # 扩张率，用于捕捉长距离依赖
  dilations_list:
    - - 1
      - 1
      - 1
    - - 1
      - 2
      - 4
  # 步幅，用于下采样
  strides_list:
    - - 1
      - 1
      - 1
    - - 1
      - 1
      - 1
  # 是否使用残差连接（CNN内部）
  use_skip_connections_list:
    - true
    - true
  # 多路径聚合方法
  aggregation_method: concat

# 第二个DNN模块配置（特征变换）
dnn2:
  # 每个DNN路径的隐藏层维度列表
  hidden_dims_list:
    - - 512
      - 256
    - - 256
      - 128
  # 激活函数
  activations: relu
  # dropout率
  dropouts: 0.2
  # 是否使用LayerNorm
  use_layer_norms: true
  # 多路径聚合方法
  aggregation_method: concat

# RNN模块配置（时序建模）
rnn:
  # RNN类型：gru, lstm, rnn
  rnn_types:
    - gru
    - lstm
  # 隐藏层维度
  hidden_dims:
    - 256
    - 256
  # 层数
  num_layers_list:
    - 2
    - 2
  # RNN dropout
  dropout_list:
    - 0.3
    - 0.3
  # 聚合方法，attention表示使用注意力机制
  aggregation_method: attention
  # 是否使用注意力聚合
  use_attention_aggregation: true

# 输出层配置
output:
  # 输出类型：regression(回归), classification(分类)
  output_type: regression
  # 输出维度，回归任务通常为1
  output_dim: 1
  # 分类任务的类别数
  num_classes: null
  # 是否返回整个序列（False时只返回最后一个时间步）
  return_sequences: false

# 模块间残差连接配置（加速收敛）
residual:
  # 是否启用残差连接
  enabled: true
  # 残差连接强度，0-1之间
  strength: 0.15
  # 残差连接路径
  skip_connections:
    - dnn1_to_cnn
    - cnn_to_dnn2
    - dnn2_to_rnn

# 运行设备：cuda, cpu
device: cuda

# 创建日期
created_date: '2024-01-20 10:30:00'
# 作者
author: TimeSeriesAI
# 标签
tags:
  - forecasting
  - multi-scale
  - parallel