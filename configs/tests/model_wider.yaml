# config.yaml
# config_default.yaml
model:
  name: "MultiFreqMultiLabelClassifier"
  device: "auto"
  init_seed: 1111

  low_freq:
    name: "low_freq"
    input_dim: 14                     #
    input_seq_len: 30                #

    init_seed: 42                     #
    deterministic_init: true          #
    device: auto                      #

    use_residual_connections: true    
    residual_strength: 0.1            #

    use_film: false                     #

    dnn1:
      name: "lf_dnn1"
      hidden_dims_list:
        - [ 32, 64, 128, 256 ]                   #
        - [ 16, 64, 128, 256 ]                   #
      hidden_dims_nums:
        - [2, 2, 2, 2 ]                      #
        - [2, 2, 2, 2 ]
      activations: [ leaky_relu, leaky_relu ]       #
      leaky_alpha: 0.1
      dropouts: [ 0.1, 0.1 ]           #
      use_layer_norms: [ false, false ]   #
      aggregation_method: concat      #concat / sum / mean / max

    cnn:
      name: "lf_cnn"
      hidden_dims_list:
        - [ 128, 256, 256 ]           #
        - [ 128, 128, 256 ]           #
      kernel_sizes_list:
        - [ 3, 6, 12 ]
        - [ 3, 6, 24 ]
      use_skip_connections_list: [ true, true ]  
      aggregation_method: concat     

    dnn2:
      name: "lf_dnn2"
      hidden_dims_list:
        - [ 512, 256, 128, 256]                #
        - [ 384, 256, 128, 256]                #
      hidden_dims_nums:
        - [ 2, 2, 2, 2 ]                    #
        - [ 2, 2, 2, 2 ]
      activations: [ leaky_relu, leaky_relu ]       #
      leaky_alpha: 0.1
      dropouts: 0.3                 #
      use_layer_norms: true         # 
      aggregation_method: concat       #

    rnn:
      name: "lf_rnn"
      rnn_types: [ gru, gru ]            
      hidden_dims: [ 256, 128 ]
      num_layers_list: [ 2, 4 ]
      dropout_list: [ 0.2, 0.2 ]      #
      aggregation_method: concat      #
      use_attention_aggregation: false  #

    out_puts:
      name: "lf_output"
      hidden_dims_list:
        - [256, 128]               #
      hidden_dims_nums:
        - [ 2, 2 ]
      activations: [ leaky_relu ]       #
      leaky_alpha: 0.1
      dropouts: 0.2                 #
      use_layer_norms: true         #
      aggregation_method: concat       #


    return_sequences: false           #

  mid_freq:
    name: "mid_freq"
    input_dim: 17                     #
    input_seq_len: 30                #

    init_seed: 1111                     #
    deterministic_init: false          #

    use_residual_connections: true    
    residual_strength: 0.3            #

    use_film: true                     #

    dnn1:
      name: "mf_dnn1"
      hidden_dims_list:
        - [ 32, 64, 128, 256 ]                   #
        - [ 64, 96, 128, 256 ]                   #
      hidden_dims_nums:
        - [ 2, 2, 4, 4 ]                      #
        - [ 2, 2, 4, 4 ]
      activations: [ leaky_relu, leaky_relu ]       #
      leaky_alpha: 0.1
      dropouts: [ 0.1, 0.1 ]           #
      use_layer_norms: [ true, true ]   #
      aggregation_method: concat      # concat / sum / mean / max

    cnn:
      name: "mf_cnn"
      hidden_dims_list:
        - [ 128, 256, 256 ]           #
        - [ 128, 128, 256 ]           #
      kernel_sizes_list:
        - [ 3, 5, 7 ]                 # 
        - [ 5, 7, 15 ]
      use_skip_connections_list: [ true, true ]  #
      aggregation_method: concat     #

    dnn2:
      name: "mf_dnn2"
      hidden_dims_list:
        - [ 512, 256, 128 ]                #
        - [ 384, 256, 128 ]                #
      hidden_dims_nums:
        - [ 2, 4, 8 ]                    #
        - [ 2, 4, 8 ]
      activations: [ leaky_relu, leaky_relu ]       #
      leaky_alpha: 0.1
      dropouts: 0.2                 #
      use_layer_norms: true         #
      aggregation_method: concat       #

    rnn:
      name: "mf_rnn"
      rnn_types: [ gru, gru ]            #
      hidden_dims: [ 256, 128 ]       # 
      num_layers_list: [ 2, 2 ]       #
      dropout_list: [ 0.2, 0.2 ]      #
      aggregation_method: concat      #
      use_attention_aggregation: false  #
    out_puts:
      name: "mf_dnn2"
      hidden_dims_list:
        - [ 256, 128, 64]                #
      hidden_dims_nums:
        - [ 2, 4, 4 ]
      activations: [ leaky_relu ]       #
      leaky_alpha: 0.1
      dropouts: 0.3                 #
      use_layer_norms: true         #
      aggregation_method: concat       #
    return_sequences: false           #

  classification:
    num_labels: 2
    label_dnn_param:
      hidden_dims: [128, 64, 16]
      hidden_dims_nums: [2,4,8]
      activation: leaky_relu
      leaky_alpha: 0.01
      dropout: 0.2
      use_layer_norm: True
      use_residual: True
      residual_frequency: 2  # 每多少层添加一次残差
      residual_strength: 0.1

    threshold: 0.5

  evaluation:
    metrics: ["accuracy", "f1_micro", "f1_macro", "precision", "recall"]
    threshold: 0.5
    average_methods: ["micro", "macro", "weighted"]

class_config:
  ls_choice:
    1m: 2
    3m: 2
    5m: 2
    15m: 2
    30m: 2
  volat:
    1m: 2
    3m: 2
    5m: 2
    15m: 2
    30m: 2

training:
  seed: 1111                   
  batch_size: 16
  num_epochs: 10
  grad_clip: 1.0                
  device: "auto"                
  interval: 300
  md_interval: 60
  low_freq_type: factor_k1h
  mid_freq_type: factor_k1m
  prefetch_factor: 0
  lr: 0.0003
  weight_decay: 0.0001
  betas:
    - 0.9
    - 0.999
  label_start: 6
  label_end: 8
  label_type: ls1_labels
  alphas:
    - 0.91
    - 0.91
# ==========================================
# ==========================================
callbacks:
  save_dir: "checkpoints/exp_m4_big_and_deep3"  
  patience: 3                 
