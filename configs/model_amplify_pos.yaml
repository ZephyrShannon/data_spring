# config.yaml
# config_default.yaml
model:
  name: "MultiFreqMultiLabelClassifier"
  device: "auto"
  init_seed: 1111

  low_freq:
    name: "low_freq"
    input_dim: 14                     #
    input_seq_len: 300                #

    init_seed: 42                     #
    deterministic_init: true          #
    device: auto                      #

    use_residual_connections: true    
    residual_strength: 0.2            #

    use_film: false                     #
    context_dim: 64                #

    dnn1:
      name: "lf_dnn1"
      hidden_dims_list:
        - [ 32, 64, 128 ]                   #
        - [ 16, 64, 128 ]                   #
      hidden_dims_nums:
        - [32, 20, 8 ]                      #
        - [32, 20, 8 ]
      activations: [ relu, relu ]       #
      dropouts: [ 0.1, 0.15 ]           #
      use_layer_norms: [ true, true ]   #
      aggregation_method: concat      #concat / sum / mean / max

    cnn:
      name: "lf_cnn"
      hidden_dims_list:
        - [ 128, 256, 256 ]           #
        - [ 128, 128, 256 ]           #
      kernel_sizes_list:
        - [ 3, 5, 7 ]                 
        - [ 5, 7, 14 ]
      use_skip_connections_list: [ true, true ]  
      aggregation_method: concat     

    dnn2:
      name: "lf_dnn2"
      hidden_dims_list:
        - [ 512, 256, 128]                #
        - [ 384, 256, 128]                #
      hidden_dims_nums:
        - [ 4, 8, 15 ]                    # 
        - [ 4, 8, 15 ]
      activations: relu             # 
      dropouts: 0.2                 # 
      use_layer_norms: true         # 
      aggregation_method: concat       #

    rnn:
      name: "lf_rnn"
      rnn_types: [ gru, gru ]            
      hidden_dims: [ 256, 128 ]       
      num_layers_list: [ 2, 4 ]       
      dropout_list: [ 0.2, 0.2 ]      #
      aggregation_method: concat      #
      use_attention_aggregation: false  #

    out_puts: [256, 256, 128, 128, 128, 64, 64, 64]           
    return_sequences: false           #

  mid_freq:
    name: "mid_freq"
    input_dim: 17                     #
    input_seq_len: 300                #

    init_seed: 1111                     #
    deterministic_init: false          #

    use_residual_connections: true    
    residual_strength: 0.2            #

    use_film: true                     # 
    context_dim: 64                # 

    dnn1:
      name: "mf_dnn1"
      hidden_dims_list:
        - [ 32, 64, 128 ]                   # 
        - [ 64, 96, 128 ]                   #
      hidden_dims_nums:
        - [ 20, 8, 3 ]                      # 
        - [ 10, 6, 3 ]
      activations: [ relu, relu ]       # 
      dropouts: [ 0.1, 0.15 ]           # 
      use_layer_norms: [ true, true ]   #
      aggregation_method: concat      # concat / sum / mean / max

    cnn:
      name: "mf_cnn"
      hidden_dims_list:
        - [ 128, 256, 256 ]           #
        - [ 128, 128, 256 ]           #
      kernel_sizes_list:
        - [ 3, 5, 7 ]                 # 
        - [ 5, 7, 15 ]
      use_skip_connections_list: [ true, true ]  #
      aggregation_method: concat     #

    dnn2:
      name: "mf_dnn2"
      hidden_dims_list:
        - [ 512, 256, 128 ]                #
        - [ 384, 256, 128 ]                #
      hidden_dims_nums:
        - [ 1, 2, 8 ]                    #
        - [ 1, 2, 8 ]
      activations: relu             # 
      dropouts: 0.2                 #
      use_layer_norms: true         #
      aggregation_method: sum       # 

    rnn:
      name: "mf_rnn"
      rnn_types: [ gru, gru ]            #
      hidden_dims: [ 256, 128 ]       # 
      num_layers_list: [ 2, 4 ]       #
      dropout_list: [ 0.3, 0.3 ]      #
      aggregation_method: concat      #
      use_attention_aggregation: false  #
    out_puts: [ 256, 128, 64 ]           # 
    return_sequences: false           #

  classification:
    num_labels: 2
    per_label_hidden_dims: [128, 64, 64, 32, 32, 32, 32,  16, 16, 16, 16]
    label_dropout: 0.2
    use_batch_norm: true
    threshold: 0.5

  evaluation:
    metrics: ["accuracy", "f1_micro", "f1_macro", "precision", "recall"]
    threshold: 0.5
    average_methods: ["micro", "macro", "weighted"]

class_config:
  ls_choice:
    1m: 2
    3m: 2
    5m: 2
    15m: 2
    30m: 2
  volat:
    1m: 2
    3m: 2
    5m: 2
    15m: 2
    30m: 2

training:
  seed: 1111                   
  batch_size: 64              
  num_epochs: 3
  grad_clip: 1.0                
  device: "auto"                
  interval: 300
  low_freq_type: factor_k1h
  mid_freq_type: factor_k5m
  prefetch_factor: 1
  lr: 0.002
  weight_decay: 0.001
  label_start: 6
  label_end: 8
  label_type: ls1_labels
  alphas:
    - 0.95
    - 0.95
# ==========================================
# ==========================================
callbacks:
  save_dir: "checkpoints/exp_m4_amplify_pos1"  
  patience: 3                 
