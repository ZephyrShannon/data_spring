# config.yaml
model:
  total_input_dim: 206
  high_freq_dim: 175
  mid_freq_dim: 17
  low_freq_dim: 14
  seq_len: 600

  router_lstm_hidden: 32
  router_output_dim: 16
  router_lstm_layers: 8
  router_lstm_parallelism: 4

  num_experts: 5
  expert_lstm_hidden: 32
  expert_lstm_layers: 16
  expert_lstm_parallelism: 2
  expert_dropout: 0.2

  fusion_lstm_hidden: 64
  fusion_lstm_layers: 4
  fusion_lstm_parallelism: 4


  output_targets: 10
  test_duration_days: 3
  val_ratio: 0.01

training:
  batch_size: 2                # M 系列芯片显存有限，建议 16 或 32
  prefetch_factor: 0
  learning_rate: 0.001
  num_epochs: 120
  grad_clip: 1.0                # 梯度裁剪阈值
  device: "auto"                # 自动选择：mps / cuda / cpu
  interval: 60

  # 学习率调度
  lr_scheduler:
    patience: 5
    factor: 0.5
    min_lr: 1e-6

  # 早停（可选）
  early_stopping:
    patience: 10
    min_delta: 1e-5